<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T13.2 Hub - Custom Pastel</title>
    <link rel="stylesheet" href="style.css?v=22">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- KHU VỰC KHÓA BẢO MẬT & ĐĂNG NHẬP -->
    <div id="auth-modal-body"></div>

    <header>
        <div class="header-logo">🍀 T13.2 HUB</div>
        <div style="display:flex; align-items:center; gap:8px;">
            <img id="header-avatar" src="" style="width:36px; height:36px; border-radius:50%; object-fit:cover; border:2px solid var(--primary-color);">
            <div>
                <div id="header-username" style="font-size:12px; font-weight:700;">Thành viên</div>
                <span id="user-role-badge" class="badge bg-sage">Học sinh</span>
            </div>
        </div>
    </header>

    <div class="container" id="main-app">
        <!-- 1. TAB TRANG CHỦ -->
        <div id="tab-home" class="view-section active">
            <div id="admin-role-manager-box"></div>

            <div class="card">
                <h3 style="color:var(--text-color);">📊 Biểu Đồ Thống Kê Lớp T13.2</h3>
                <div style="height:200px; margin-top:10px;">
                    <canvas id="chartBarTasks"></canvas>
                </div>
            </div>
        </div>

        <!-- 2. TAB LAO ĐỘNG & BẢNG GHI LỖI -->
        <div id="tab-labor" class="view-section"></div>

        <!-- 3. TAB CÔNG VIỆC -->
        <div id="tab-tasks" class="view-section">
            <div class="card bcs-only">
                <h3 style="color:var(--text-color);">📌 Ban Cán Sự: Tạo Công Việc Mới</h3>
                <input type="text" id="task-title-input" class="form-control" placeholder="Tên công việc...">
                
                <div style="margin-top:6px;">
                    <label style="font-size:11px; font-weight:bold;">Tích chọn học sinh phụ trách làm:</label>
                    <div style="display:flex; gap:8px; margin:4px 0;">
                        <button type="button" onclick="toggleSelectAllTaskStudents(true)" class="btn btn-primary" style="font-size:10px; padding:2px 6px;">Chọn Tất Cả</button>
                        <button type="button" onclick="toggleSelectAllTaskStudents(false)" class="btn btn-danger" style="font-size:10px; padding:2px 6px;">Bỏ Chọn</button>
                    </div>
                    <div id="task-assign-student-checkboxes" style="max-height:120px; overflow-y:auto; padding:6px; border:1px solid var(--border-color); border-radius:8px; background:#fff;"></div>
                </div>

                <button type="button" onclick="createNewClassTask()" class="btn btn-primary btn-block" style="margin-top:8px;">🚀 Giao Việc</button>
            </div>
            <div id="tasks-container"></div>
        </div>

        <!-- 4. TAB RANDOM -->
        <div id="tab-random" class="view-section">
            <div class="card">
                <h3 style="color:var(--text-color);">🎲 Random Vòng Quay Có Avatar</h3>
                <input type="text" id="rand-purpose" class="form-control" placeholder="Mục đích bốc thăm...">
                <div class="grid-2">
                    <input type="number" id="rand-count" class="form-control" value="1" placeholder="Số lượng chọn">
                    <input type="number" id="rand-duration" class="form-control" value="3" placeholder="Thời gian quay (s)">
                </div>
                
                <select id="rand-mode-select" class="form-control" style="margin-top:6px;">
                    <option value="slot">🎰 Vòng Quay Slot Machine</option>
                    <option value="card">🃏 Lật Thẻ Bài Bí Mật</option>
                    <option value="lottery">🎟️ Lồng Cầu Xổ Số (Bóng Nảy)</option>
                </select>

                <button type="button" onclick="executeCustomRandomSpin()" class="btn btn-warning btn-block" style="margin-top:8px;">🎲 Quay Ngẫu Nhiên</button>
                <div id="rand-winner-box" style="margin-top:10px; display:none;"></div>
            </div>
            <details class="card">
                <summary style="font-size:12px; font-weight:bold; cursor:pointer;">⚙️ Tích chọn loại trừ học sinh bận...</summary>
                <div id="rand-exclusion-list" style="margin-top:8px; max-height:120px; overflow-y:auto;"></div>
            </details>
        </div>

        <!-- 5. TAB QUỸ LỚP -->
        <div id="tab-fund" class="view-section">
            <div id="fund-container-box"></div>
        </div>

        <!-- 6. TAB ALBUM KỶ NIỆM -->
        <div id="tab-memories" class="view-section">
            <div class="card" style="margin-bottom:12px;">
                <h3 style="color:var(--text-color); margin-top:0;">📸 Tạo Album Kỷ Niệm Mới</h3>
                <input type="text" id="album-title-input" class="form-control" placeholder="Nhập tên Album kỷ niệm..." style="margin-bottom:8px;">
                <input type="date" id="album-date-input" class="form-control" style="margin-bottom:8px;">
                <label style="font-size:11px; font-weight:bold; color:#666;">Ảnh bìa Album (Không bắt buộc):</label>
                <input type="file" id="album-cover-file" accept="image/*" class="form-control" style="margin-bottom:8px;">
                <button type="button" onclick="createNewAlbum()" class="btn btn-primary btn-block">✨ Đăng Album Mới</button>
            </div>
            <div id="memories-album-grid"></div>
        </div>

        <!-- 7. TAB THƯ ẨN DANH & KHO TÀI LIỆU -->
        <div id="tab-docs" class="view-section">
            <div class="card">
                <h3 style="color:var(--text-color);">🔒 Thư Góp Ý Ẩn Danh</h3>
                <input type="text" id="anonymous-text-input" class="form-control" placeholder="Nhập góp ý ẩn danh...">
                <button type="button" onclick="sendAnonymousFeedback()" class="btn btn-danger btn-block" style="margin-top:6px;">🔒 Gửi Ẩn Danh</button>
                <div id="feedback-list-box" style="margin-top:10px;"></div>
            </div>

            <div class="card">
                <h3 style="color:var(--text-color);">📁 Kho Tài Liệu (Tên Môn Tùy Ý)</h3>
                <input type="text" id="doc-folder-custom-input" class="form-control" placeholder="Nhập tên môn / Tên thư mục (VD: Toán, Văn, Lý)...">
                <input type="file" id="doc-file-input" class="form-control">
                <button type="button" onclick="uploadDocumentFile()" class="btn btn-primary btn-block" style="margin-top:6px;">📤 Tải Tệp Lên Kho</button>
                <div id="documents-folder-box" style="margin-top:10px;"></div>
            </div>
        </div>

        <!-- 8. TAB TRANG CÁ NHÂN -->
        <div id="tab-profile" class="view-section">
            <div class="card" style="text-align:center;">
                <h3>👤 Trang Cá Nhân</h3>
                <img id="profile-avatar-preview" src="" style="width:80px; height:80px; border-radius:50%; object-fit:cover; border:3px solid var(--primary-color); margin-top:8px;">
                <input type="file" id="profile-avatar-input" accept="image/*" onchange="previewProfileAvatar(event)" style="font-size:11px; margin-top:6px;">

                <div style="margin-top:10px; text-align:left;">
                    <label style="font-size:11px; font-weight:bold;">Tên thật:</label>
                    <input type="text" id="profile-name-input" class="form-control" readonly style="background:#f0f0f0;">

                    <label style="font-size:11px; font-weight:bold;">Biệt danh (Nickname):</label>
                    <input type="text" id="profile-nickname-input" class="form-control" placeholder="Nhập biệt danh...">

                    <label style="font-size:11px; font-weight:bold;">Giới thiệu bản thân (Bio):</label>
                    <textarea id="profile-bio-input" class="form-control" rows="2" placeholder="Ghi vài dòng giới thiệu..."></textarea>

                    <button type="button" onclick="saveUserProfileInfo()" class="btn btn-primary btn-block" style="margin-top:6px;">💾 Lưu Thông Tin Cá Nhân</button>
                </div>

                <div style="margin-top:14px; text-align:left;">
                    <label style="font-size:12px; font-weight:bold;">🎨 Tông màu giao diện:</label>
                    <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;">
                        <button type="button" onclick="changeUserTheme('default')" class="btn btn-primary" style="font-size:10px;">🌱 Cỏ 4 Lá</button>
                        <button type="button" onclick="changeUserTheme('blue')" class="btn" style="background:#48cae4; color:#fff; font-size:10px;">🌊 Biển Cả</button>
                        <button type="button" onclick="changeUserTheme('lavender')" class="btn" style="background:#a855f7; color:#fff; font-size:10px;">🔮 Mơ Mộng</button>
                        <button type="button" onclick="changeUserTheme('coral')" class="btn" style="background:#ff758f; color:#fff; font-size:10px;">🌅 Hoàng Hôn</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODALS OVERLAY -->
    <div id="album-detail-modal" class="card" style="display:none; position:fixed; top:5%; left:5%; right:5%; bottom:5%; z-index:200; overflow-y:auto; background:#fff; border:3px solid var(--primary-color);">
        <div id="album-detail-content"></div>
    </div>

    <!-- THANH NAV MENU DƯỚI -->
    <nav>
        <button type="button" onclick="switchTab('tab-home')" class="active">📊 Trang chủ</button>
        <button type="button" onclick="switchTab('tab-labor')">🧹 Lao động</button>
        <button type="button" onclick="switchTab('tab-tasks')">📌 Công việc</button>
        <button type="button" onclick="switchTab('tab-random')">🎲 Random</button>
        <button type="button" onclick="switchTab('tab-fund')">💰 Quỹ lớp</button>
        <button type="button" onclick="switchTab('tab-memories')">📸 Kỷ niệm</button>
        <button type="button" onclick="switchTab('tab-docs')">📁 Tài liệu</button>
        <button type="button" onclick="switchTab('tab-profile')">👤 Cá nhân</button>
    </nav>

    <!-- THƯ VIỆN BÊN NGOÀI -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <!-- CÁC FILE CHỨC NĂNG NỘI BỘ DỰ ÁN -->
    <script src="data.js"></script>
    <script src="sync-cloud.js"></script>
    <script src="app.js"></script>
    <script src="auth.js"></script>
    <script src="discipline_duty.js"></script>
    <script src="profile.js"></script>
    <script src="random.js"></script>
    <script src="tasks.js"></script>
    <script src="fund_score.js"></script>
    <script src="memories.js"></script>
    <script src="feedback_docs.js"></script>
</body>
</html>
